name: Diagnose Pages setup

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attempt Pages setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Current Pages configuration:"
            gh api "repos/${{ github.repository }}/pages"
            echo "Creating Pages site with GitHub Actions build type:"
            gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow
          } > setup.log 2>&1 || true
          cat setup.log
      - name: Publish setup log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          content=$(base64 -w0 setup.log)
          api="repos/${{ github.repository }}/contents/BUILD_LOG.txt"
          sha=$(gh api "$api" --jq .sha)
          gh api -X PUT "$api" -f sha="$sha" -f message="Record Pages setup diagnostics" -f content="$content" -f branch=master